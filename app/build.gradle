plugins {
    id 'com.android.application'
}


final int medianVersionCode = 92
final String medianVersionName = '2.3.0'

android {
    namespace 'com.xinyv.median'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xinyv.median.compat'
        minSdk 26
        targetSdk 36
        versionCode medianVersionCode
        versionName medianVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = false
    }

    signingConfigs {
        release {
            def storeFileValue = System.getenv('MEDIAN_KEYSTORE')
            def storePasswordValue = System.getenv('MEDIAN_STOREPASS')
            def keyAliasValue = System.getenv('MEDIAN_KEY_ALIAS')
            def keyPasswordValue = System.getenv('MEDIAN_KEYPASS') ?: storePasswordValue
            if (storeFileValue && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFileValue)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                enableV1Signing false
                enableV2Signing true
                enableV3Signing false
                enableV4Signing false
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        checkDependencies true
        sarifReport true
        xmlReport true
        htmlReport true
        disable 'OldTargetApi'
    }

    testOptions {
        animationsDisabled true
        unitTests.returnDefaultValues = true
    }

    packaging {
        resources.excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
        ]
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
