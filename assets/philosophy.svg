<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="phTitle">
  <title id="phTitle">设计哲学：无限进步，无限优化，无限极速</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121820"/>
      <stop offset="1" stop-color="#0A0D11"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4B8DF8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4B8DF8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .cn { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .en { font-family: "SF Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="25.25" fill="none" stroke="#232C38" stroke-width="1.5"/>
  <path d="M400 40V260M800 40V260" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <circle cx="200" cy="112" r="120" fill="url(#glow)"/>
  <circle cx="600" cy="112" r="120" fill="url(#glow)"/>
  <circle cx="1000" cy="112" r="120" fill="url(#glow)"/>

  <!-- 01 无限进步：上升的阶梯 -->
  <g transform="translate(200 112)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-58 34H-30V10H-2V-14H26V-38H44" stroke="#88919E" stroke-width="3"/>
    <path d="M36 -46L48 -38L36 -30" stroke="#4B8DF8" stroke-width="3"/>
    <circle cx="-58" cy="34" r="4.5" fill="#4B8DF8" stroke="none"/>
  </g>

  <!-- 02 无限优化：同心收敛 -->
  <g transform="translate(600 112)" fill="none">
    <circle r="48" stroke="#2A3341" stroke-width="3"/>
    <circle r="32" stroke="#5A6472" stroke-width="3"/>
    <circle r="16" stroke="#8A93A0" stroke-width="3"/>
    <circle r="4.5" fill="#4B8DF8" stroke="none"/>
    <path d="M0-62V-54M0 54V62M-62 0H-54M54 0H62" stroke="#4B8DF8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- 03 无限极速：叠加的加速箭头 -->
  <g transform="translate(1000 112)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-46 -30L-10 0L-46 30" stroke="#2A3341" stroke-width="4"/>
    <path d="M-8 -30L28 0L-8 30" stroke="#5A6472" stroke-width="4"/>
    <path d="M34 -30L70 0L34 30" stroke="#4B8DF8" stroke-width="4"/>
  </g>

  <g class="en" fill="#5E6876" font-size="11" letter-spacing="3.4" text-anchor="middle">
    <text x="200" y="46">01</text>
    <text x="600" y="46">02</text>
    <text x="1000" y="46">03</text>
  </g>

  <g class="cn" text-anchor="middle">
    <text x="200" y="216" font-size="29" font-weight="600" letter-spacing="2" fill="#E7EAF0">无限进步</text>
    <text x="600" y="216" font-size="29" font-weight="600" letter-spacing="2" fill="#E7EAF0">无限优化</text>
    <text x="1000" y="216" font-size="29" font-weight="600" letter-spacing="2" fill="#E7EAF0">无限极速</text>
  </g>

  <g class="en" fill="#7C8695" font-size="10.5" letter-spacing="3.2" text-anchor="middle">
    <text x="200" y="246">ENDLESS PROGRESS</text>
    <text x="600" y="246">ENDLESS REFINEMENT</text>
    <text x="1000" y="246">ENDLESS SPEED</text>
  </g>
</svg>
