name: Signed release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify tag and app version
        run: ./tools/verify_release_tag.sh "$GITHUB_REF_NAME"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MEDIAN_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/median-release.p12"
          chmod 600 "$RUNNER_TEMP/median-release.p12"
      - name: Build signed APK and AAB
        env:
          MEDIAN_KEYSTORE: ${{ runner.temp }}/median-release.p12
          MEDIAN_STOREPASS: ${{ secrets.MEDIAN_STOREPASS }}
          MEDIAN_KEY_ALIAS: ${{ secrets.MEDIAN_KEY_ALIAS }}
          MEDIAN_KEYPASS: ${{ secrets.MEDIAN_KEYPASS }}
        run: ./build.sh --release
      - name: Package release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/MedianBrowser-${GITHUB_REF_NAME}.apk
          cp app/build/outputs/bundle/release/app-release.aab release/MedianBrowser-${GITHUB_REF_NAME}.aab
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt release/MedianBrowser-${GITHUB_REF_NAME}-mapping.txt
          fi
          sha256sum release/* | tee release/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Median Browser $GITHUB_REF_NAME"
